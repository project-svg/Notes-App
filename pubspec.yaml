name: notes_app
description: >
  A production-grade notes app demonstrating senior Flutter architecture,
  Material 3 design, Hive local storage, and Provider state management.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── Local storage ──────────────────────────────────────
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── State management ───────────────────────────────────
  provider: ^6.1.1

  # ── Navigation ─────────────────────────────────────────
  go_router: ^13.2.0

  # ── UI ─────────────────────────────────────────────────
  flutter_slidable: ^3.0.1
  google_fonts: ^6.1.0
  flutter_animate: ^4.5.0
  flutter_staggered_grid_view: ^0.7.0

  # ── Utilities ──────────────────────────────────────────
  uuid: ^4.3.3
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_lints: ^3.0.0
  mockito: ^5.4.4
  build: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/
